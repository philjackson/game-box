[package]
name = "game-box"
version = "0.1.0"
edition = "2021"
description = "A TUI game manager focused on Wine/Proton gaming"
license = "GPL-3.0-or-later"

[[bin]]
name = "gbox"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 2
strip = true
